# XIAO ESP32S3 dashboard listeners.
# Append this block to the Mosquitto install's mosquitto.conf (default on
# Windows: C:\Program Files\Mosquitto\mosquitto.conf) and restart the
# mosquitto service. Mosquitto 2.x binds to loopback ONLY when no listener
# is configured, so both lines below are required even for a "just works"
# local-network setup.
#
# LAN-facing on 0.0.0.0 for a private/trusted network only. Add a password
# file (mosquitto_passwd) and TLS before exposing this beyond a home/office LAN.
allow_anonymous true

listener 1883 0.0.0.0

listener 9001 0.0.0.0
protocol websockets
