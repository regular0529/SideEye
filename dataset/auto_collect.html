<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>SideEye 자동 수집기</title>
<style>
body{font-family:sans-serif;background:#111;color:#eee;text-align:center;margin:0;padding:16px}
#slide{width:320px;height:240px;object-fit:contain;border-radius:8px;border:3px solid #444;background:#000}
#cam{width:160px;height:160px;object-fit:cover;border-radius:8px;border:2px solid #666;vertical-align:top}
.row{display:flex;gap:16px;justify-content:center;align-items:flex-start;margin:12px}
button{font-size:16px;padding:9px 14px;margin:5px;border-radius:8px;border:none;background:#4c8bf5;color:#fff;cursor:pointer}
button.stop{background:#e04c4c}
button.dl{background:#3fbf6f}
button:disabled{opacity:.4;cursor:default}
#status{font-size:15px;color:#9f9;margin:8px}
#gallery{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:680px;margin:12px auto}
.shot{position:relative}
.shot img{width:56px;height:56px;object-fit:cover;border-radius:5px;border:2px solid #555}
.shot .lb{position:absolute;left:0;bottom:0;right:0;background:rgba(0,0,0,.6);font-size:9px}
</style>
</head>
<body>
<h2>SideEye vehicle / background 자동 수집</h2>
<div class="row">
  <div>
    <img id="slide" src="">
    <div>슬라이드 <span id="slideN">0</span>/<span id="slideTotal">0</span></div>
  </div>
  <img id="cam" src="">
</div>
<div>
  <button onclick="startSlideshow('vehicle','vehicle_source')">차량 슬라이드쇼 시작 (vehicle, 5초)</button>
  <button onclick="startSlideshow('background','background_source')">배경 슬라이드쇼 시작 (background, 5초)</button>
  <button class="stop" onclick="stopAll()">정지</button>
</div>
<div>
  <button class="dl" onclick="zipAll()">ZIP 다운로드</button>
  <button style="background:#666" onclick="clearAll()">전체 비우기</button>
</div>
<div id="status">대기 중</div>
<div id="gallery"></div>
<script>
const ESP32 = "http://192.168.0.188";
const INTERVAL_MS = 5000;
let shots = [];       // {label, u8, url}
let slideIdx = 0;
let timer = null;
let camTimer = setInterval(()=>{document.getElementById('cam').src=ESP32+'/jpg?t='+Date.now()}, 700);

function labelCount(label){ return shots.filter(s=>s.label===label).length; }
let manifest = null;
async function loadManifest(){
  if (manifest) return manifest;
  const r = await fetch('manifest.json', {cache:'no-store'});
  manifest = await r.json();
  return manifest;
}

async function captureOne(label){
  const r = await fetch(ESP32+'/jpg?t='+Date.now(), {mode:'cors', cache:'no-store'});
  const u8 = new Uint8Array(await r.arrayBuffer());
  const url = URL.createObjectURL(new Blob([u8], {type:'image/jpeg'}));
  shots.push({label, u8, url});
  render();
}

function stopAll(){
  if (timer){ clearInterval(timer); timer = null; }
  document.getElementById('status').textContent = `정지됨 - vehicle ${labelCount('vehicle')}장, background ${labelCount('background')}장 캡처됨`;
}

async function startSlideshow(label, folder){
  stopAll();
  const m = await loadManifest();
  const images = (m[label] || []).map(name => `${folder}/${name}`);
  document.getElementById('slideTotal').textContent = images.length;
  slideIdx = 0;
  document.getElementById('status').textContent = `${label} 슬라이드쇼 진행 중 (${images.length}장)`;
  timer = setInterval(async () => {
    if (slideIdx >= images.length){ stopAll(); return; }
    document.getElementById('slide').src = images[slideIdx];
    document.getElementById('slideN').textContent = slideIdx + 1;
    await captureOne(label);
    slideIdx++;
  }, INTERVAL_MS);
}

function clearAll(){
  if (!confirm('전부 삭제할까요?')) return;
  shots.forEach(s => URL.revokeObjectURL(s.url));
  shots = [];
  render();
}

function render(){
  document.getElementById('gallery').innerHTML = shots.map((s,i) =>
    `<div class="shot"><img src="${s.url}"><div class="lb">${s.label}</div></div>`).join('');
  document.getElementById('status').textContent = `vehicle ${labelCount('vehicle')}장, background ${labelCount('background')}장 캡처됨`;
}

// ---- minimal ZIP (store, no compression) ----
const CRC_T=(()=>{let t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(u8){let c=0xFFFFFFFF;for(let i=0;i<u8.length;i++)c=CRC_T[(c^u8[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0}
function zipAll(){
  if(!shots.length){alert('보관된 사진이 없습니다');return}
  const enc=new TextEncoder(), parts=[], cdir=[]; let off=0, counts={};
  for(const s of shots){
    counts[s.label]=(counts[s.label]||0)+1;
    const name=enc.encode(s.label+'/'+s.label+'.'+counts[s.label]+'.jpg');
    const crc=crc32(s.u8), sz=s.u8.length;
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint32(14,crc,true);
    lh.setUint32(18,sz,true);lh.setUint32(22,sz,true);lh.setUint16(26,name.length,true);
    parts.push(new Uint8Array(lh.buffer),name,s.u8);
    const cd=new DataView(new ArrayBuffer(46));
    cd.setUint32(0,0x02014b50,true);cd.setUint16(4,20,true);cd.setUint16(6,20,true);
    cd.setUint32(16,crc,true);cd.setUint32(20,sz,true);cd.setUint32(24,sz,true);
    cd.setUint16(28,name.length,true);cd.setUint32(42,off,true);
    cdir.push(new Uint8Array(cd.buffer),name);
    off+=30+name.length+sz;
  }
  let cdLen=0; cdir.forEach(p=>cdLen+=p.length);
  const end=new DataView(new ArrayBuffer(22));
  end.setUint32(0,0x06054b50,true);end.setUint16(8,shots.length,true);end.setUint16(10,shots.length,true);
  end.setUint32(12,cdLen,true);end.setUint32(16,off,true);
  const blob=new Blob([...parts,...cdir,new Uint8Array(end.buffer)],{type:'application/zip'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download='sideeye_dataset.zip'; a.click();
  URL.revokeObjectURL(a.href);
}

render();
</script>
</body>
</html>
